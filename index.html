<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Element Layer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0608">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
<style>
  :root {
    --void: #0a0608; --deep: #120a0e; --ink: #1a0f12;
    --fire: #e84020; --fire-dim: #802010; --fire-bright: #ff8060;
    --water: #2060e8; --water-dim: #103080; --water-bright: #60a0ff;
    --earth: #a06020; --earth-dim: #604010; --earth-bright: #d4a060;
    --wind: #c0b020; --wind-dim: #706810; --wind-bright: #f0e060;
    --text: #e8dcc0; --text-dim: #7a7060;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--void); color:var(--text);
    font-family:'Noto Serif JP',serif; font-weight:200;
    min-height:100vh; overflow-x:hidden; cursor:crosshair;
  }

  #bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; width:100%; height:100%; }

  .lang-bar {
    position:fixed; top:0; right:0; left:0; z-index:100;
    display:flex; justify-content:center; align-items:center;
    padding:8px 16px; gap:2px; flex-wrap:nowrap; overflow-x:auto;
    background:linear-gradient(to bottom,rgba(10,6,8,0.95) 0%,transparent 100%);
    scrollbar-width:none;
  }
  .lang-bar::-webkit-scrollbar { display:none; }
  .lang-btn {
    display:flex; align-items:center; gap:5px;
    padding:10px 12px; background:transparent;
    border:1px solid transparent; border-radius:2px;
    color:var(--text-dim); font-family:inherit; font-size:0.68rem;
    letter-spacing:0.04em; cursor:pointer; transition:all 0.25s; white-space:nowrap;
    touch-action:manipulation; min-height:44px;
  }
  .lang-btn.active { color:var(--earth-bright); border-color:rgba(192,176,32,0.35); background:rgba(192,176,32,0.06); }

  .wrap { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:0 24px; }

  header { text-align:center; padding:100px 0 50px; }
  .element-sigil { width:90px; height:90px; margin:0 auto 28px; position:relative; }
  .element-sigil svg { width:100%; height:100%; animation:sigil-spin 8s linear infinite; }
  @keyframes sigil-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  .element-sigil::after {
    content:''; position:absolute; inset:-14px; border-radius:50%;
    background:radial-gradient(circle,rgba(192,176,32,0.12) 0%,transparent 70%);
    animation:pulse-glow 4s ease-in-out infinite;
  }
  @keyframes pulse-glow { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.8;transform:scale(1.1)} }

  h1 {
    font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:clamp(2rem,5vw,3rem); letter-spacing:0.25em;
    color:var(--earth-bright); margin-bottom:8px;
    text-shadow:0 0 40px rgba(192,176,32,0.5);
  }
  .subtitle { font-size:0.72rem; letter-spacing:0.35em; color:var(--text-dim); margin-bottom:40px; }

  /* 4タイプ説明カード（表示のみ） */
  .element-cards {
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:8px;
  }
  .element-card {
    padding:14px; border:1px solid; border-radius:2px;
    text-align:center; position:relative; overflow:hidden;
  }
  .element-card.fire   { border-color:var(--fire-dim);  background:rgba(232,64,32,0.06); }
  .element-card.water  { border-color:var(--water-dim); background:rgba(32,96,232,0.06); }
  .element-card.earth  { border-color:var(--earth-dim); background:rgba(160,96,32,0.06); }
  .element-card.wind   { border-color:var(--wind-dim);  background:rgba(192,176,32,0.06); }
  .element-icon { font-size:1.8rem; margin-bottom:5px; }
  .element-name { font-size:0.85rem; letter-spacing:0.12em; margin-bottom:4px; }
  .element-name.fire  { color:var(--fire-bright); }
  .element-name.water { color:var(--water-bright); }
  .element-name.earth { color:var(--earth-bright); }
  .element-name.wind  { color:var(--wind-bright); }
  .element-keywords { font-size:0.6rem; color:var(--text-dim); letter-spacing:0.04em; line-height:1.8; }

  .oracle-form {
    position:relative; border:1px solid rgba(192,176,32,0.15);
    padding:40px 32px; margin-bottom:32px; background:rgba(26,15,18,0.6);
    backdrop-filter:blur(10px);
  }
  .corner { position:absolute; width:16px; height:16px; border-color:var(--wind-dim); border-style:solid; }
  .corner.tl { top:-1px; left:-1px; border-width:1px 0 0 1px; }
  .corner.tr { top:-1px; right:-1px; border-width:1px 1px 0 0; }
  .corner.bl { bottom:-1px; left:-1px; border-width:0 0 1px 1px; }
  .corner.br { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }

  .field { margin-bottom:20px; }
  .field label { display:block; font-size:0.65rem; letter-spacing:0.15em; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea {
    width:100%; background:rgba(255,255,255,0.03);
    border:1px solid rgba(192,176,32,0.15); border-radius:1px;
    color:var(--text); padding:10px 14px; outline:none;
    font-family:inherit; font-size:0.82rem; transition:border-color .3s;
    box-sizing:border-box;
  }
  .field input:focus, .field textarea:focus { border-color:rgba(192,176,32,0.4); }
  .field select option { background:#1a0f12; }

  .invoke-btn {
    width:100%; padding:16px; background:transparent;
    border:1px solid rgba(192,176,32,0.4); color:var(--earth-bright);
    font-family:inherit; font-size:0.8rem; letter-spacing:0.25em;
    cursor:pointer; transition:all .4s; touch-action:manipulation;
    box-sizing:border-box;
  }
  .invoke-btn:hover { background:rgba(192,176,32,0.08); border-color:rgba(192,176,32,0.7); }

  .error-msg { display:none; margin-top:16px; padding:12px 16px; border:1px solid rgba(192,176,32,0.3); color:#c0b060; font-size:0.75rem; line-height:1.8; }
  .error-msg.show { display:block; }

  .loading-veil { display:none; text-align:center; padding:60px 0; }
  .loading-veil.show { display:block; }
  .orb {
    width:60px; height:60px; margin:0 auto 24px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,rgba(232,64,32,0.5),rgba(32,96,232,0.3),rgba(192,176,32,0.4));
    box-shadow:0 0 40px rgba(192,176,32,0.3); animation:orb-spin 2s ease-in-out infinite;
  }
  @keyframes orb-spin { 0%,100%{transform:scale(1) rotate(0deg)} 50%{transform:scale(1.2) rotate(180deg)} }
  .loading-text { font-size:0.7rem; letter-spacing:0.4em; color:var(--text-dim); animation:fade-text 1.5s ease-in-out infinite; }
  @keyframes fade-text { 0%,100%{opacity:0.3} 50%{opacity:1} }

  .result-scroll { display:none; margin-bottom:32px; border:1px solid rgba(192,176,32,0.2); padding:40px 32px; background:rgba(26,15,18,0.7); backdrop-filter:blur(10px); animation:fadeIn 0.8s ease; }
  .result-scroll.show { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .result-header { text-align:center; margin-bottom:28px; }
  .result-element-icon { font-size:4rem; margin-bottom:8px; animation:icon-pulse 2s ease-in-out infinite; }
  @keyframes icon-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .result-element-name {
    font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:clamp(2rem,6vw,3.5rem); letter-spacing:0.2em; margin-bottom:8px;
  }
  .result-element-name.fire  { color:var(--fire-bright);  text-shadow:0 0 40px rgba(232,64,32,0.5); }
  .result-element-name.water { color:var(--water-bright); text-shadow:0 0 40px rgba(32,96,232,0.5); }
  .result-element-name.earth { color:var(--earth-bright); text-shadow:0 0 40px rgba(160,96,32,0.5); }
  .result-element-name.wind  { color:var(--wind-bright);  text-shadow:0 0 40px rgba(192,176,32,0.5); }
  .result-sub { font-size:0.7rem; letter-spacing:0.2em; color:var(--text-dim); }
  .divider { text-align:center; margin:24px 0; font-size:0.7rem; letter-spacing:0.3em; color:var(--wind-dim); }
  .fortune-text { font-size:0.88rem; line-height:2.2; letter-spacing:0.06em; color:var(--text); white-space:pre-wrap; }
  .reset-btn {
    display:block; margin:28px auto 0; padding:12px 40px;
    background:transparent; border:1px solid rgba(192,176,32,0.25);
    color:var(--text-dim); font-family:inherit; font-size:0.72rem;
    letter-spacing:0.2em; cursor:pointer; transition:all .3s; touch-action:manipulation;
  }
  .reset-btn:hover { border-color:rgba(192,176,32,0.5); color:var(--text); }

  .apikey-wrap { margin-bottom:24px; }
  footer { text-align:center; padding:40px 0 60px; font-size:0.6rem; letter-spacing:0.2em; color:var(--text-dim); }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('ja')" data-lang="ja">🇯🇵 日本語</button>
  <button class="lang-btn" onclick="setLang('en')" data-lang="en">🇺🇸 English</button>
  <button class="lang-btn" onclick="setLang('zh')" data-lang="zh">🇨🇳 中文</button>
  <button class="lang-btn" onclick="setLang('ko')" data-lang="ko">🇰🇷 한국어</button>
  <button class="lang-btn" onclick="setLang('fr')" data-lang="fr">🇫🇷 Français</button>
</div>

<div class="wrap">
  <header>
    <div class="element-sigil">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="45" cy="45" r="42" stroke="#c0b020" stroke-width="0.5" opacity="0.6"/>
        <circle cx="45" cy="45" r="30" stroke="#c0b020" stroke-width="0.3" opacity="0.4"/>
        <!-- 火（上）-->
        <path d="M45 15 L52 30 L45 26 L38 30Z" fill="rgba(232,64,32,0.5)" stroke="#e84020" stroke-width="0.8"/>
        <!-- 水（右）-->
        <path d="M75 45 L60 38 L64 45 L60 52Z" fill="rgba(32,96,232,0.5)" stroke="#2060e8" stroke-width="0.8"/>
        <!-- 土（下）-->
        <path d="M45 75 L38 60 L45 64 L52 60Z" fill="rgba(160,96,32,0.5)" stroke="#a06020" stroke-width="0.8"/>
        <!-- 風（左）-->
        <path d="M15 45 L30 52 L26 45 L30 38Z" fill="rgba(192,176,32,0.5)" stroke="#c0b020" stroke-width="0.8"/>
        <!-- 中心円 -->
        <circle cx="45" cy="45" r="8" fill="rgba(192,176,32,0.15)" stroke="#c0b020" stroke-width="0.8"/>
        <circle cx="45" cy="45" r="3" fill="rgba(192,176,32,0.6)"/>
        <!-- 対角線 -->
        <line x1="22" y1="22" x2="68" y2="68" stroke="#c0b020" stroke-width="0.3" opacity="0.3"/>
        <line x1="68" y1="22" x2="22" y2="68" stroke="#c0b020" stroke-width="0.3" opacity="0.3"/>
      </svg>
    </div>
    <h1 id="appTitle">Element Layer</h1>
    <p class="subtitle" id="appSubtitle">四大元素のタイプ診断</p>
  </header>

  <div class="oracle-form" id="formSection">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <!-- 4タイプ説明（表示のみ） -->
    <div class="field">
      <label id="lElementInfo">四大元素タイプについて</label>
      <div class="element-cards">
        <div class="element-card fire">
          <div class="element-icon">🔥</div>
          <div class="element-name fire" id="fireName">火タイプ</div>
          <div class="element-keywords" id="fireKw">情熱・行動力・リーダー<br>牡羊座・獅子座・射手座</div>
        </div>
        <div class="element-card water">
          <div class="element-icon">💧</div>
          <div class="element-name water" id="waterName">水タイプ</div>
          <div class="element-keywords" id="waterKw">感受性・直感・共感力<br>蟹座・蠍座・魚座</div>
        </div>
        <div class="element-card earth">
          <div class="element-icon">🌿</div>
          <div class="element-name earth" id="earthName">土タイプ</div>
          <div class="element-keywords" id="earthKw">安定・忍耐・現実的<br>牡牛座・乙女座・山羊座</div>
        </div>
        <div class="element-card wind">
          <div class="element-icon">🌬</div>
          <div class="element-name wind" id="windName">風タイプ</div>
          <div class="element-keywords" id="windKw">知性・自由・社交性<br>双子座・天秤座・水瓶座</div>
        </div>
      </div>
    </div>

    <!-- APIキー -->
    <div class="apikey-wrap">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field" style="margin-bottom:0">
          <label id="lGemmaKey">🔵 Gemma APIキー</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="password" id="gemmaKey" placeholder="AIza..." style="flex:1;font-family:monospace;font-size:0.72rem;">
            <button onclick="toggleGemmaKey()" id="toggleGemmaBtn" style="padding:8px 10px;background:transparent;border:1px solid rgba(192,176,32,0.2);color:var(--text-dim);font-size:0.65rem;cursor:pointer;white-space:nowrap;transition:all .3s">表示</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label id="lApiKey">⚡ Groq APIキー</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="password" id="apiKey" placeholder="gsk_..." style="flex:1;font-family:monospace;font-size:0.72rem;">
            <button onclick="toggleApiKeyVisibility()" id="toggleBtn" style="padding:8px 10px;background:transparent;border:1px solid rgba(192,176,32,0.2);color:var(--text-dim);font-size:0.65rem;cursor:pointer;white-space:nowrap;transition:all .3s">表示</button>
          </div>
        </div>
      </div>
      <p id="apikeyNote" style="font-size:0.62rem;color:var(--text-dim);margin-top:6px;letter-spacing:0.05em;line-height:1.8">どちらか一方のAPIキーがあれば動作します。両方入力するとGemmaを優先します。</p>
    </div>

    <!-- 生年月日 -->
    <div class="field">
      <label id="lBirth">生年月日</label>
      <input type="date" id="birthdate">
    </div>

    <!-- 姓名 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div class="field" style="margin-bottom:0">
        <label id="lLastName">姓（任意）</label>
        <input type="text" id="lastName">
      </div>
      <div class="field" style="margin-bottom:0">
        <label id="lFirstName">名（任意）</label>
        <input type="text" id="firstName">
      </div>
    </div>

    <!-- 質問 -->
    <div class="field">
      <label id="lQuestion">質問・悩み（任意）</label>
      <textarea id="question" rows="3" style="resize:vertical"></textarea>
    </div>

    <button class="invoke-btn" id="invokeBtn"></button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="loading-veil" id="loadingVeil">
    <div class="orb"></div>
    <p class="loading-text" id="loadingText"></p>
  </div>

  <div class="result-scroll" id="resultScroll">
    <div class="result-header">
      <div class="result-element-icon" id="resultIcon"></div>
      <div class="result-element-name" id="resultName"></div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div class="divider"><span>✦</span></div>
    <div class="fortune-text" id="fortuneText"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetForm()"></button>
  </div>

  <footer><p id="footerText"></p></footer>
</div>

<script>
// ══════════════════════════════════════════
// 元素データ
// ══════════════════════════════════════════
const ELEMENTS = {
  fire:  { icon:'🔥', ja:'火タイプ', en:'Fire Type', zh:'火型', ko:'불 타입', fr:'Type Feu',
           zodiac:['牡羊座','獅子座','射手座'], color:'fire' },
  water: { icon:'💧', ja:'水タイプ', en:'Water Type', zh:'水型', ko:'물 타입', fr:'Type Eau',
           zodiac:['蟹座','蠍座','魚座'], color:'water' },
  earth: { icon:'🌿', ja:'土タイプ', en:'Earth Type', zh:'土型', ko:'흙 타입', fr:'Type Terre',
           zodiac:['牡牛座','乙女座','山羊座'], color:'earth' },
  wind:  { icon:'🌬', ja:'風タイプ', en:'Wind Type', zh:'风型', ko:'바람 타입', fr:'Type Vent',
           zodiac:['双子座','天秤座','水瓶座'], color:'wind' },
};

// 星座→元素のマッピング
const ZODIAC_ELEMENT = {
  '牡羊座':'fire','獅子座':'fire','射手座':'fire',
  '蟹座':'water','蠍座':'water','魚座':'water',
  '牡牛座':'earth','乙女座':'earth','山羊座':'earth',
  '双子座':'wind','天秤座':'wind','水瓶座':'wind',
};
const ZODIAC_CUTS = [[1,20],[2,19],[3,21],[4,20],[5,21],[6,22],[7,23],[8,23],[9,23],[10,24],[11,23],[12,22]];
const ZODIAC_JA = ['山羊座','水瓶座','魚座','牡羊座','牡牛座','双子座','蟹座','獅子座','乙女座','天秤座','蠍座','射手座'];

function getZodiac(dateStr) {
  const d=new Date(dateStr); const m=d.getMonth()+1; const day=d.getDate();
  for(let i=0;i<ZODIAC_CUTS.length;i++){
    const [cm,cd]=ZODIAC_CUTS[i];
    if(m<cm||(m===cm&&day<cd)) return ZODIAC_JA[i];
  }
  return ZODIAC_JA[0];
}
function getElement(dateStr) {
  return ZODIAC_ELEMENT[getZodiac(dateStr)] || 'fire';
}
function getLifeNum(dateStr) {
  let s=dateStr.replace(/-/g,'').split('').map(Number).reduce((a,b)=>a+b,0);
  while(s>9&&s!==11&&s!==22) s=String(s).split('').map(Number).reduce((a,b)=>a+b,0);
  return s;
}

// ══════════════════════════════════════════
// i18n
// ══════════════════════════════════════════
const I18N = {
  ja: {
    lang:'ja', appTitle:'Element Layer', appSubtitle:'四大元素のタイプ診断',
    lApiKey:'⚡ Groq APIキー', lBirth:'生年月日',
    lLastName:'姓（任意）', lFirstName:'名（任意）',
    lQuestion:'質問・悩み（任意）',
    lElementInfo:'四大元素タイプについて',
    fireName:'火タイプ', waterName:'水タイプ', earthName:'土タイプ', windName:'風タイプ',
    fireKw:'情熱・行動力・リーダー<br>牡羊座・獅子座・射手座',
    waterKw:'感受性・直感・共感力<br>蟹座・蠍座・魚座',
    earthKw:'安定・忍耐・現実的<br>牡牛座・乙女座・山羊座',
    windKw:'知性・自由・社交性<br>双子座・天秤座・水瓶座', waterName:'水タイプ', earthName:'土タイプ', windName:'風タイプ', waterKw:'感受性・直感・共感力', windKw:'知性・自由・社交性',
    invokeBtn:'元素を読み解く',
    loadingText:'あなたの元素を読み解いています…',
    resetBtn:'もう一度診断する',
    footerText:'Element Layer — 四大元素のタイプ診断',
    toggleShow:'表示', toggleHide:'隠す',
    errApiKey:'Groq APIキーを入力してください',
    errBirth:'生年月日を入力してください',
    errAPI:'APIエラーが発生しました',
    apikeyNote:'Groq Console（console.groq.com）に無料登録してAPIキーを取得。完全無料。クレジットカード不要。',
    system:`あなたは四大元素（火・水・土・風）の占術師です。
生年月日・星座・エレメントタイプ・数秘術をもとに、詳細で具体的なタイプ診断を日本語で行ってください。
以下を含む診断文を600〜900文字で生成してください：
- そのエレメントタイプの本質と特徴
- 性格・才能・長所
- 注意点・弱点とアドバイス
- 恋愛・仕事・人間関係での傾向
- 今後の指針とメッセージ`,
    buildPrompt:(name, bd, zodiac, elem, lp, q) =>
      `名前：${name||'（未入力）'}\n生年月日：${bd}\n星座：${zodiac}\nエレメント：${ELEMENTS[elem].ja}\n数秘：ライフパス${lp}\n${q?`質問：${q}\n`:''}今日：${new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'})}`
  },

// ストレージ
function storageSave(key,value){ try{localStorage.setItem(key,value);}catch(e){} try{const ex=new Date();ex.setFullYear(ex.getFullYear()+1);document.cookie=encodeURIComponent(key)+'='+encodeURIComponent(value)+'; expires='+ex.toUTCString()+'; path=/; SameSite=Lax';}catch(e){} }
function storageLoad(key){ try{const v=localStorage.getItem(key);if(v!==null)return v;}catch(e){} try{const n=encodeURIComponent(key)+'=';for(let p of document.cookie.split(';')){p=p.trim();if(p.startsWith(n))return decodeURIComponent(p.substring(n.length));}}catch(e){} return null; }
function saveData(){ const d={apiKey:document.getElementById('apiKey').value,gemmaKey:document.getElementById('gemmaKey').value,birthdate:document.getElementById('birthdate').value,lastName:document.getElementById('lastName').value,firstName:document.getElementById('firstName').value,lang:currentLang};try{storageSave('elementlayer_data',JSON.stringify(d));}catch(e){} }
function loadData(){ try{const raw=storageLoad('elementlayer_data');if(!raw)return;const d=JSON.parse(raw);if(d.apiKey)document.getElementById('apiKey').value=d.apiKey;if(d.gemmaKey)document.getElementById('gemmaKey').value=d.gemmaKey;if(d.birthdate)document.getElementById('birthdate').value=d.birthdate;if(d.lastName)document.getElementById('lastName').value=d.lastName;if(d.firstName)document.getElementById('firstName').value=d.firstName;if(d.lang)setLang(d.lang);}catch(e){} }

// 共通AI呼び出し（Gemma優先・Groqフォールバック）
async function callAI(prompt){
  const gemmaKey=document.getElementById('gemmaKey').value.trim();
  const groqKey=document.getElementById('apiKey').value.trim();

  if(gemmaKey){
    try{
      const res=await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemma-3-27b-it:generateContent?key=${gemmaKey}`,
        {method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1400,temperature:0.9}})}
      );
      const data=await res.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(res.ok&&text) return text;
    }catch(e){}
  }

  if(groqKey){
    const MODELS=['llama-3.3-70b-versatile','llama3-70b-8192','gemma2-9b-it'];
    for(const model of MODELS){
      try{
        const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
          body:JSON.stringify({model,max_tokens:1400,temperature:0.9,messages:[{role:'user',content:prompt}]})
        });
        const data=await res.json();
        if(res.ok&&data.choices?.[0]?.message?.content) return data.choices[0].message.content;
      }catch(e){continue;}
    }
  }
  throw new Error('APIキーを入力してください');
}

async function invokeElement(){
  try{
  const t=I18N[currentLang];
  const gemmaKey=document.getElementById('gemmaKey').value.trim();
  const groqKey=document.getElementById('apiKey').value.trim();
  const bd=document.getElementById('birthdate').value;
  const lastName=document.getElementById('lastName').value.trim();
  const firstName=document.getElementById('firstName').value.trim();
  const question=document.getElementById('question').value.trim();

  document.getElementById('errorMsg').className='error-msg';
  if(!gemmaKey&&!groqKey){showError(t.errApiKey);return;}
  if(!bd){showError(t.errBirth);return;}
  try{saveData();}catch(e){}

  const zodiac=getZodiac(bd);
  const elem=getElement(bd);
  const lp=getLifeNum(bd);
  const name=(lastName+' '+firstName).trim();
  const prompt=t.system+'\n\n'+t.buildPrompt(name,bd,zodiac,elem,lp,question);

  document.getElementById('formSection').style.display='none';
  document.getElementById('loadingVeil').className='loading-veil show';
  document.getElementById('resultScroll').className='result-scroll';

  const text=await callAI(prompt);

  const el=ELEMENTS[elem];
  document.getElementById('loadingVeil').className='loading-veil';
  document.getElementById('resultIcon').textContent=el.icon;
  const nameEl=document.getElementById('resultName');
  nameEl.textContent=el[currentLang==='ja'?'ja':currentLang==='zh'?'zh':currentLang==='ko'?'ko':currentLang==='fr'?'fr':'en'];
  nameEl.className='result-element-name '+el.color;
  document.getElementById('resultSub').textContent=`${zodiac} · Life Path ${lp}`;
  document.getElementById('fortuneText').textContent=text;
  document.getElementById('resultScroll').className='result-scroll show';
  }catch(err){
    document.getElementById('loadingVeil').className='loading-veil';
    document.getElementById('formSection').style.display='block';
    const msg=err.message||'';
    if(msg.startsWith('GROQ_FAILED:')) showError('Groqエラー: '+msg.slice(12));
    else showError(I18N[currentLang].errAPI+(msg?'（'+msg.slice(0,60)+'）':''));
  }
}

// ══════════════════════════════════════════
// Background Canvas（炎・波・大地・風）
// ══════════════════════════════════════════
(function(){
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize(); window.addEventListener('resize',()=>{resize();init();});

  // ── 炎パーティクル（右上）
  let flames=[];
  function initFlames(){
    flames=[];
    const cx=canvas.width*0.82, cy=canvas.height*0.25;
    for(let i=0;i<35;i++){
      flames.push({
        x:cx+(Math.random()-0.5)*60,
        y:cy+Math.random()*30,
        vx:(Math.random()-0.5)*0.8,
        vy:-(Math.random()*1.5+0.8),
        size:Math.random()*8+3,
        life:Math.random(),
        maxLife:Math.random()*60+30,
        hue:Math.random()*30, // 赤〜オレンジ
      });
    }
  }

  // ── 波（左側）
  const WAVES=[
    {amp:18,freq:0.018,speed:0.022,y:0.35,alpha:0.18,color:'0,80,200'},
    {amp:12,freq:0.025,speed:0.030,y:0.40,alpha:0.22,color:'20,100,220'},
    {amp:8, freq:0.035,speed:0.040,y:0.44,alpha:0.25,color:'40,130,240'},
  ];

  // ── 大地パーティクル（下部）
  let earths=[];
  function initEarths(){
    earths=[];
    for(let i=0;i<25;i++){
      earths.push({
        x:Math.random()*canvas.width,
        y:canvas.height*0.75+Math.random()*canvas.height*0.25,
        size:Math.random()*4+2,
        alpha:Math.random()*0.3+0.1,
        twinkle:Math.random()*Math.PI*2,
        speed:Math.random()*0.02+0.005,
      });
    }
  }

  // ── 風のライン（左上〜右下）
  let windLines=[];
  function initWind(){
    windLines=[];
    for(let i=0;i<20;i++){
      windLines.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height*0.6,
        len:Math.random()*80+30,
        vx:Math.random()*2+1,
        vy:(Math.random()-0.5)*0.5,
        alpha:Math.random()*0.2+0.05,
        life:Math.random(),
        maxLife:Math.random()*120+60,
      });
    }
  }

  function init(){ initFlames(); initEarths(); initWind(); }
  init();

  let frame=0;
  function draw(){
    // 背景（暗い）
    ctx.fillStyle='rgba(10,6,8,0.22)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(frame===0){ctx.fillStyle='#0a0608';ctx.fillRect(0,0,canvas.width,canvas.height);}

    // ── 炎（右上エリア）
    flames.forEach(f=>{
      f.x+=f.vx; f.y+=f.vy; f.life+=1/f.maxLife;
      f.size*=0.98;
      if(f.life>=1||f.size<0.5){
        const cx=canvas.width*0.82;
        const cy=canvas.height*0.25;
        f.x=cx+(Math.random()-0.5)*60;
        f.y=cy+Math.random()*30;
        f.vx=(Math.random()-0.5)*0.8;
        f.vy=-(Math.random()*1.5+0.8);
        f.size=Math.random()*8+3;
        f.life=0; f.maxLife=Math.random()*60+30;
      }
      const a=Math.sin(f.life*Math.PI)*0.6;
      const r=255; const g=Math.floor(80+f.hue*4); const b=0;
      const grd=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.size);
      grd.addColorStop(0,`rgba(${r},${g},${b},${a})`);
      grd.addColorStop(1,`rgba(${r},${Math.floor(g/2)},0,0)`);
      ctx.globalAlpha=1;
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.size,0,Math.PI*2); ctx.fill();
    });

    // ── 波（左エリア）
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, canvas.height*0.28, canvas.width*0.5, canvas.height*0.25);
    ctx.clip();
    WAVES.forEach((w,wi)=>{
      const baseY=canvas.height*w.y;
      ctx.beginPath();
      ctx.moveTo(0,canvas.height);
      for(let x=0;x<=canvas.width*0.5+2;x+=2){
        const y=baseY+Math.sin(x*w.freq+frame*w.speed)*w.amp
          +Math.sin(x*w.freq*1.6+frame*w.speed*0.7+wi)*w.amp*0.4;
        x===0?ctx.lineTo(0,y):ctx.lineTo(x,y);
      }
      ctx.lineTo(canvas.width*0.5,canvas.height);
      ctx.closePath();
      const wGrd=ctx.createLinearGradient(0,baseY-w.amp,0,canvas.height);
      wGrd.addColorStop(0,`rgba(${w.color},${w.alpha*0.5})`);
      wGrd.addColorStop(0.3,`rgba(${w.color},${w.alpha})`);
      wGrd.addColorStop(1,`rgba(${w.color},${w.alpha*1.8})`);
      ctx.fillStyle=wGrd; ctx.fill();
      // 波頭
      ctx.beginPath();
      for(let x=0;x<=canvas.width*0.5+2;x+=2){
        const y=baseY+Math.sin(x*w.freq+frame*w.speed)*w.amp+Math.sin(x*w.freq*1.6+frame*w.speed*0.7+wi)*w.amp*0.4;
        x===0?ctx.moveTo(0,y):ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`rgba(${w.color},${w.alpha*0.6})`; ctx.lineWidth=1.2; ctx.stroke();
    });
    ctx.restore();

    // ── 大地（下部）
    earths.forEach(e=>{
      const a=e.alpha*(0.5+0.5*Math.sin(frame*e.speed+e.twinkle));
      ctx.globalAlpha=a;
      ctx.fillStyle='rgba(140,90,30,1)';
      ctx.fillRect(e.x-e.size/2,e.y-e.size/2,e.size,e.size);
    });
    // 大地のライン
    ctx.globalAlpha=0.08;
    ctx.strokeStyle='rgba(160,96,32,1)'; ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      const y=canvas.height*(0.78+i*0.06);
      ctx.beginPath(); ctx.moveTo(0,y);
      for(let x=0;x<=canvas.width;x+=20){
        ctx.lineTo(x, y+Math.sin(x*0.02+frame*0.01+i)*6);
      }
      ctx.stroke();
    }

    // ── 風のライン
    ctx.globalAlpha=1;
    windLines.forEach(w=>{
      w.x+=w.vx; w.y+=w.vy; w.life+=1/w.maxLife;
      if(w.life>=1||w.x>canvas.width+100){
        w.x=-w.len; w.y=Math.random()*canvas.height*0.6; w.life=0;
        w.maxLife=Math.random()*120+60;
      }
      const a=Math.sin(w.life*Math.PI)*w.alpha;
      ctx.globalAlpha=a;
      ctx.strokeStyle='rgba(220,200,60,1)'; ctx.lineWidth=0.8;
      ctx.beginPath();
      ctx.moveTo(w.x,w.y);
      ctx.bezierCurveTo(w.x+w.len*0.3,w.y-8,w.x+w.len*0.7,w.y+6,w.x+w.len,w.y);
      ctx.stroke();
      // 小さな渦
      ctx.beginPath();
      ctx.arc(w.x+w.len, w.y, 3, 0, Math.PI*1.5);
      ctx.stroke();
    });

    ctx.globalAlpha=1;
    frame++; requestAnimationFrame(draw);
  }
  draw();
})();
