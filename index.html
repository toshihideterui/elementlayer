<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Element Layer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0608">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
<style>
  :root {
    --void: #0a0608; --deep: #120a0e; --ink: #1a0f12;
    --fire: #e84020; --fire-dim: #802010; --fire-bright: #ff8060;
    --water: #2060e8; --water-dim: #103080; --water-bright: #60a0ff;
    --earth: #a06020; --earth-dim: #604010; --earth-bright: #d4a060;
    --wind: #c0b020; --wind-dim: #706810; --wind-bright: #f0e060;
    --text: #e8dcc0; --text-dim: #7a7060;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--void); color:var(--text);
    font-family:'Noto Serif JP',serif; font-weight:200;
    min-height:100vh; overflow-x:hidden; cursor:crosshair;
  }

  #bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; width:100%; height:100%; }

  .lang-bar {
    position:fixed; top:0; right:0; left:0; z-index:100;
    display:flex; justify-content:center; align-items:center;
    padding:8px 16px; gap:2px; flex-wrap:nowrap; overflow-x:auto;
    background:linear-gradient(to bottom,rgba(10,6,8,0.95) 0%,transparent 100%);
    scrollbar-width:none;
  }
  .lang-bar::-webkit-scrollbar { display:none; }
  .lang-btn {
    display:flex; align-items:center; gap:5px;
    padding:10px 12px; background:transparent;
    border:1px solid transparent; border-radius:2px;
    color:var(--text-dim); font-family:inherit; font-size:0.68rem;
    letter-spacing:0.04em; cursor:pointer; transition:all 0.25s; white-space:nowrap;
    touch-action:manipulation; min-height:44px;
  }
  .lang-btn.active { color:var(--earth-bright); border-color:rgba(192,176,32,0.35); background:rgba(192,176,32,0.06); }

  .wrap { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:0 24px; }

  header { text-align:center; padding:100px 0 50px; }
  .element-sigil { width:90px; height:90px; margin:0 auto 28px; position:relative; }
  .element-sigil svg { width:100%; height:100%; animation:sigil-spin 8s linear infinite; }
  @keyframes sigil-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  .element-sigil::after {
    content:''; position:absolute; inset:-14px; border-radius:50%;
    background:radial-gradient(circle,rgba(192,176,32,0.12) 0%,transparent 70%);
    animation:pulse-glow 4s ease-in-out infinite;
  }
  @keyframes pulse-glow { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.8;transform:scale(1.1)} }

  h1 {
    font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:clamp(2rem,5vw,3rem); letter-spacing:0.25em;
    color:var(--earth-bright); margin-bottom:8px;
    text-shadow:0 0 40px rgba(192,176,32,0.5);
  }
  .subtitle { font-size:0.72rem; letter-spacing:0.35em; color:var(--text-dim); margin-bottom:40px; }

  .apikey-wrap { margin-bottom:24px; }
  footer { text-align:center; padding:40px 0 60px; font-size:0.6rem; letter-spacing:0.2em; color:var(--text-dim); }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('ja')" data-lang="ja">🇯🇵 日本語</button>
  <button class="lang-btn" onclick="setLang('en')" data-lang="en">🇺🇸 English</button>
  <button class="lang-btn" onclick="setLang('zh')" data-lang="zh">🇨🇳 中文</button>
  <button class="lang-btn" onclick="setLang('ko')" data-lang="ko">🇰🇷 한국어</button>
  <button class="lang-btn" onclick="setLang('fr')" data-lang="fr">🇫🇷 Français</button>
</div>

<div class="wrap">
  <header>
    <div class="element-sigil">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="45" cy="45" r="42" stroke="#c0b020" stroke-width="0.5" opacity="0.6"/>
        <circle cx="45" cy="45" r="30" stroke="#c0b020" stroke-width="0.3" opacity="0.4"/>
        <!-- 火（上）-->
        <path d="M45 15 L52 30 L45 26 L38 30Z" fill="rgba(232,64,32,0.5)" stroke="#e84020" stroke-width="0.8"/>
        <!-- 水（右）-->
        <path d="M75 45 L60 38 L64 45 L60 52Z" fill="rgba(32,96,232,0.5)" stroke="#2060e8" stroke-width="0.8"/>
        <!-- 土（下）-->
        <path d="M45 75 L38 60 L45 64 L52 60Z" fill="rgba(160,96,32,0.5)" stroke="#a06020" stroke-width="0.8"/>
        <!-- 風（左）-->
        <path d="M15 45 L30 52 L26 45 L30 38Z" fill="rgba(192,176,32,0.5)" stroke="#c0b020" stroke-width="0.8"/>
        <!-- 中心円 -->
        <circle cx="45" cy="45" r="8" fill="rgba(192,176,32,0.15)" stroke="#c0b020" stroke-width="0.8"/>
        <circle cx="45" cy="45" r="3" fill="rgba(192,176,32,0.6)"/>
        <!-- 対角線 -->
        <line x1="22" y1="22" x2="68" y2="68" stroke="#c0b020" stroke-width="0.3" opacity="0.3"/>
        <line x1="68" y1="22" x2="22" y2="68" stroke="#c0b020" stroke-width="0.3" opacity="0.3"/>
      </svg>
    </div>
    <h1 id="appTitle">Element Layer</h1>
    <p class="subtitle" id="appSubtitle">四大元素のタイプ診断</p>
  </header>

  <div class="oracle-form" id="formSection">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <!-- APIキー -->
    <div class="apikey-wrap">
      <div class="field">
        <label id="lApiKey">⚡ Groq APIキー</label>
        <div style="display:flex;gap:8px;align-items:flex-start">
          <textarea id="apiKey" rows="2" placeholder="gsk_..." style="flex:1;resize:vertical;font-family:monospace;font-size:0.78rem;-webkit-text-security:disc;text-security:disc"></textarea>
          <button onclick="toggleApiKeyVisibility()" id="toggleBtn" style="padding:10px 14px;background:transparent;border:1px solid rgba(192,176,32,0.2);color:var(--text-dim);font-size:0.75rem;cursor:pointer;white-space:nowrap;transition:all .3s">表示</button>
        </div>
        <p id="apikeyNote" style="font-size:0.62rem;color:var(--text-dim);margin-top:6px;letter-spacing:0.05em;line-height:1.8">Groq Console（console.groq.com）に無料登録してAPIキーを取得。完全無料。クレジットカード不要。</p>
      </div>
    </div>

    <!-- 生年月日 -->
    <div class="field">
      <label id="lBirth">生年月日</label>
      <input type="date" id="birthdate">
    </div>

    <!-- 姓名 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div class="field" style="margin-bottom:0">
        <label id="lLastName">姓（任意）</label>
        <input type="text" id="lastName">
      </div>
      <div class="field" style="margin-bottom:0">
        <label id="lFirstName">名（任意）</label>
        <input type="text" id="firstName">
      </div>
    </div>

    <!-- 質問 -->
    <div class="field">
      <label id="lQuestion">質問・悩み（任意）</label>
      <textarea id="question" rows="3" style="resize:vertical"></textarea>
    </div>


    <button class="invoke-btn" id="invokeBtn"></button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="loading-veil" id="loadingVeil">
    <div class="orb"></div>
    <p class="loading-text" id="loadingText"></p>
  </div>

  <div class="result-scroll" id="resultScroll">
    <div class="result-header">
      <div class="result-element-icon" id="resultIcon"></div>
      <div class="result-element-name" id="resultName"></div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div class="divider"><span>✦</span></div>
    <div class="fortune-text" id="fortuneText"></div>
    <button class="reset-btn" id="resetBtn" onclick="resetForm()"></button>
  </div>

  <footer><p id="footerText"></p></footer>
</div>

// 星座→元素のマッピング
const ZODIAC_ELEMENT = {
  '牡羊座':'fire','獅子座':'fire','射手座':'fire',
  '蟹座':'water','蠍座':'water','魚座':'water',
  '牡牛座':'earth','乙女座':'earth','山羊座':'earth',
  '双子座':'wind','天秤座':'wind','水瓶座':'wind',
};
const ZODIAC_CUTS = [[1,20],[2,19],[3,21],[4,20],[5,21],[6,22],[7,23],[8,23],[9,23],[10,24],[11,23],[12,22]];
const ZODIAC_JA = ['山羊座','水瓶座','魚座','牡羊座','牡牛座','双子座','蟹座','獅子座','乙女座','天秤座','蠍座','射手座'];

function getZodiac(dateStr) {
  const d=new Date(dateStr); const m=d.getMonth()+1; const day=d.getDate();
  for(let i=0;i<ZODIAC_CUTS.length;i++){
    const [cm,cd]=ZODIAC_CUTS[i];
    if(m<cm||(m===cm&&day<cd)) return ZODIAC_JA[i];
  }
  return ZODIAC_JA[0];
}
function getElement(dateStr) {
  return ZODIAC_ELEMENT[getZodiac(dateStr)] || 'fire';
}
function getLifeNum(dateStr) {
  let s=dateStr.replace(/-/g,'').split('').map(Number).reduce((a,b)=>a+b,0);
  while(s>9&&s!==11&&s!==22) s=String(s).split('').map(Number).reduce((a,b)=>a+b,0);
  return s;
}

let currentLang='ja';

function setLang(lang) {
  currentLang=lang;
  const t=I18N[lang];
  document.documentElement.lang=t.lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  document.getElementById('appTitle').textContent=t.appTitle;
  document.getElementById('appSubtitle').textContent=t.appSubtitle;
  document.getElementById('lApiKey').textContent=t.lApiKey;
  document.getElementById('lBirth').textContent=t.lBirth;
  document.getElementById('lLastName').textContent=t.lLastName;
  document.getElementById('lFirstName').textContent=t.lFirstName;
  document.getElementById('lQuestion').textContent=t.lQuestion;
  document.getElementById('invokeBtn').textContent=t.invokeBtn;
  document.getElementById('loadingText').textContent=t.loadingText;
  document.getElementById('resetBtn').textContent=t.resetBtn;
  document.getElementById('footerText').textContent=t.footerText;
  document.getElementById('apikeyNote').textContent=t.apikeyNote;
  document.getElementById('toggleBtn').textContent=t.toggleShow;
  document.title=t.appTitle;
}


// ストレージ
function storageSave(key,value){ try{localStorage.setItem(key,value);}catch(e){} try{const ex=new Date();ex.setFullYear(ex.getFullYear()+1);document.cookie=encodeURIComponent(key)+'='+encodeURIComponent(value)+'; expires='+ex.toUTCString()+'; path=/; SameSite=Lax';}catch(e){} }
function storageLoad(key){ try{const v=localStorage.getItem(key);if(v!==null)return v;}catch(e){} try{const n=encodeURIComponent(key)+'=';for(let p of document.cookie.split(';')){p=p.trim();if(p.startsWith(n))return decodeURIComponent(p.substring(n.length));}}catch(e){} return null; }
function saveData(){ const d={apiKey:document.getElementById('apiKey').value,birthdate:document.getElementById('birthdate').value,lastName:document.getElementById('lastName').value,firstName:document.getElementById('firstName').value,lang:currentLang};try{storageSave('elementlayer_data',JSON.stringify(d));}catch(e){} }
function loadData(){ try{const raw=storageLoad('elementlayer_data');if(!raw)return;const d=JSON.parse(raw);if(d.apiKey)document.getElementById('apiKey').value=d.apiKey;if(d.birthdate)document.getElementById('birthdate').value=d.birthdate;if(d.lastName)document.getElementById('lastName').value=d.lastName;if(d.firstName)document.getElementById('firstName').value=d.firstName;if(d.lang)setLang(d.lang);}catch(e){} }

function toggleApiKeyVisibility(){
  const input=document.getElementById('apiKey');
  const btn=document.getElementById('toggleBtn');
  const t=I18N[currentLang];
  const isHidden=input.style.webkitTextSecurity!=='none';
  input.style.webkitTextSecurity=isHidden?'none':'disc';
  input.style.textSecurity=isHidden?'none':'disc';
  btn.textContent=isHidden?t.toggleHide:t.toggleShow;
}
function showError(msg){const el=document.getElementById('errorMsg');el.textContent=msg;el.className='error-msg show';}
function resetForm(){
  document.getElementById('resultScroll').className='result-scroll';
  document.getElementById('formSection').style.display='block';
  document.getElementById('errorMsg').className='error-msg';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function invokeElement(){
  try{
  const t=I18N[currentLang];
  const apiKey=document.getElementById('apiKey').value.trim();
  const bd=document.getElementById('birthdate').value;
  const lastName=document.getElementById('lastName').value.trim();
  const firstName=document.getElementById('firstName').value.trim();
  const question=document.getElementById('question').value.trim();

  document.getElementById('errorMsg').className='error-msg';
  if(!apiKey){showError(t.errApiKey);return;}
  if(!bd){showError(t.errBirth);return;}
  try{saveData();}catch(e){}

  const zodiac=getZodiac(bd);
  const elem=getElement(bd);
  const lp=getLifeNum(bd);
  const name=(lastName+' '+firstName).trim();
  const prompt=t.system+'\n\n'+t.buildPrompt(name,bd,zodiac,elem,lp,question);

  document.getElementById('formSection').style.display='none';
  document.getElementById('loadingVeil').className='loading-veil show';
  document.getElementById('resultScroll').className='result-scroll';

  const GROQ_MODELS=['llama-3.3-70b-versatile','llama3-70b-8192','gemma2-9b-it','llama3-8b-8192'];
  let text='',ok=false,lastErr='';
  for(const model of GROQ_MODELS){
    try{
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
        body:JSON.stringify({model,max_tokens:1400,temperature:0.9,messages:[{role:'user',content:prompt}]})
      });
      const data=await res.json();
      if(res.ok&&data.choices?.[0]?.message?.content){text=data.choices[0].message.content;ok=true;break;}
      lastErr=`${model}: ${res.status} ${data?.error?.message||''}`;
    }catch(e){lastErr=`${model}: ネットワークエラー`;}
  }
  if(!ok) throw new Error('GROQ_FAILED:'+lastErr);

  const el=ELEMENTS[elem];
  document.getElementById('loadingVeil').className='loading-veil';
  document.getElementById('resultIcon').textContent=el.icon;
  const nameEl=document.getElementById('resultName');
  nameEl.textContent=el[currentLang==='ja'?'ja':currentLang==='zh'?'zh':currentLang==='ko'?'ko':currentLang==='fr'?'fr':'en'];
  nameEl.className='result-element-name '+el.color;
  document.getElementById('resultSub').textContent=`${zodiac} · Life Path ${lp}`;
  document.getElementById('fortuneText').textContent=text;
  document.getElementById('resultScroll').className='result-scroll show';
  }catch(err){
    document.getElementById('loadingVeil').className='loading-veil';
    document.getElementById('formSection').style.display='block';
    const msg=err.message||'';
    if(msg.startsWith('GROQ_FAILED:')) showError('Groqエラー: '+msg.slice(12));
    else showError(I18N[currentLang].errAPI+(msg?'（'+msg.slice(0,60)+'）':''));
  }
}

// ══════════════════════════════════════════
// Background Canvas（4元素パーティクル）
// ══════════════════════════════════════════
(function(){
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize(); window.addEventListener('resize',()=>{resize();initParticles();});

  // 4元素のパーティクル
  const ELEMENT_COLORS=['rgba(232,64,32','rgba(32,96,232','rgba(160,96,32','rgba(192,176,32'];
  let particles=[];
  function initParticles(){
    particles=[];
    for(let i=0;i<80;i++){
      const ei=Math.floor(Math.random()*4);
      particles.push({
        x:Math.random()*canvas.width, y:Math.random()*canvas.height,
        vx:(Math.random()-0.5)*0.4, vy:-(Math.random()*0.5+0.1),
        size:Math.random()*3+0.5,
        color:ELEMENT_COLORS[ei],
        life:Math.random(), maxLife:Math.random()*200+80,
        type:ei,
      });
    }
  }

  // 星
  let stars=[];
  function initStars(){
    stars=[];
    for(let i=0;i<200;i++){
      const r=Math.random();
      stars.push({
        x:Math.random()*canvas.width, y:Math.random()*canvas.height,
        radius:r<0.6?Math.random()*0.6+0.1:r<0.9?Math.random()*1.0+0.6:Math.random()*1.5+1.0,
        baseAlpha:Math.random()*0.4+0.15,
        twinkleSpeed:Math.random()*0.02+0.005, twinkleOffset:Math.random()*Math.PI*2,
        color:r<0.2?'#f0d080':r<0.35?'#c8d8ff':'#ffffff',
      });
    }
  }
  initParticles(); initStars();

  let frame=0;
  function draw(){
    ctx.fillStyle='rgba(10,6,8,0.18)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    if(frame===0){ctx.fillStyle='#0a0608';ctx.fillRect(0,0,canvas.width,canvas.height);}

    // 星
    stars.forEach(s=>{
      const a=s.baseAlpha*(0.5+0.5*Math.sin(frame*s.twinkleSpeed+s.twinkleOffset));
      ctx.globalAlpha=a; ctx.fillStyle=s.color;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.radius,0,Math.PI*2); ctx.fill();
    });

    // 元素パーティクル
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life+=1/p.maxLife;
      if(p.life>=1){ p.x=Math.random()*canvas.width; p.y=canvas.height+10; p.life=0; }
      const a=Math.sin(p.life*Math.PI)*0.5;
      ctx.globalAlpha=a;
      // 元素によって形を変える
      ctx.fillStyle=`${p.color},1)`;
      ctx.beginPath();
      if(p.type===0){ // 火：三角
        ctx.moveTo(p.x,p.y-p.size); ctx.lineTo(p.x+p.size,p.y+p.size); ctx.lineTo(p.x-p.size,p.y+p.size);
        ctx.closePath();
      } else if(p.type===1){ // 水：丸
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      } else if(p.type===2){ // 土：四角
        ctx.rect(p.x-p.size,p.y-p.size,p.size*2,p.size*2);
      } else { // 風：ひし形
        ctx.moveTo(p.x,p.y-p.size*1.2); ctx.lineTo(p.x+p.size,p.y); ctx.lineTo(p.x,p.y+p.size*1.2); ctx.lineTo(p.x-p.size,p.y);
        ctx.closePath();
      }
      ctx.fill();
    });
    ctx.globalAlpha=1;
    frame++; requestAnimationFrame(draw);
  }
  draw();
})();
